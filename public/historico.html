<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Histórico</title><link rel="stylesheet" href="/styles.css"><script src="/app.js"></script></head>
<body>
<div id="nav"></div>
<main>
  <h3>Histórico temporal</h3>
  <table class="table" id="tbl"><thead><tr><th>Data</th><th>Candidato</th><th>Positivo</th><th>Neutro</th><th>Negativo</th></tr></thead><tbody></tbody></table>
</main>
<script>
  document.getElementById('nav').innerHTML = nav();
  getJSON('/api/historico').then((data) => {
    document.querySelector('#tbl tbody').innerHTML = data.series.map((r) =>
      `<tr><td>${r.date}</td><td>${r.candidate}</td><td>${r.positivo}</td><td>${r.neutro}</td><td>${r.negativo}</td></tr>`
    ).join('');
  });
</script>
</body>
</html>
